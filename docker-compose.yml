services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
    environment:
      - PORT=8080
      # Common ID is usually published by Docker Desktop on the host.
      # localhost inside this container refers to the backend container itself.
      - COMMON_ID_API_ORIGIN=http://host.docker.internal:18080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    command: npm run dev
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  frontend_next:
